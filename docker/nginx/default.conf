server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Full-resolution photo uploads (must match PHP upload_max_filesize/post_max_size).
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processed photos and Vite assets are immutable (ULID / hashed names) - cache aggressively.
    location ~ ^/(storage|build)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        # Image processing runs inside the request (sync pipeline) - allow long uploads.
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}
