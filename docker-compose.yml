services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: photo-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - photo-net

  web:
    image: nginx:1.27-alpine
    container_name: photo-web
    ports:
      - "${WEB_PORT:-8081}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - photo-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: photo-mailpit
    ports:
      - "${MAILPIT_PORT:-8026}:8025"
    networks:
      - photo-net

  db:
    image: mysql:8.4
    container_name: photo-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-photo}
      MYSQL_USER: ${MYSQL_USER:-photo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-photo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      # DB_PORT_HOST (not DB_PORT) so that Laravel's DB_PORT=3306 in .env keeps pointing at the container port.
      - "${DB_PORT_HOST:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - photo-net

networks:
  photo-net:
    driver: bridge

volumes:
  mysql-data:
